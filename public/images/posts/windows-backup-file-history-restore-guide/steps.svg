<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img"><title>편집부 권장 점검 순서</title><rect width="760" height="520" rx="24" fill="#f0fdfa"/><text x="380" y="52" text-anchor="middle" font-size="25" fill="#134e4a" font-family="sans-serif">편집부 권장 점검 순서</text><rect x="55" y="85" width="650" height="72" rx="14" fill="#fff" stroke="#0f766e"/><text x="380" y="130" text-anchor="middle" font-size="24" font-family="sans-serif" fill="#134e4a">1. 계정·저장소 연결 확인</text><path d="M380 163v16m-7-7 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="55" y="185" width="650" height="72" rx="14" fill="#fff" stroke="#0f766e"/><text x="380" y="230" text-anchor="middle" font-size="24" font-family="sans-serif" fill="#134e4a">2. 파일 기록 드라이브 지정</text><path d="M380 263v16m-7-7 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="55" y="285" width="650" height="72" rx="14" fill="#fff" stroke="#0f766e"/><text x="380" y="330" text-anchor="middle" font-size="24" font-family="sans-serif" fill="#134e4a">3. 시스템 보호 지점 활성화</text><path d="M380 363v16m-7-7 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="55" y="385" width="650" height="72" rx="14" fill="#fff" stroke="#0f766e"/><text x="380" y="430" text-anchor="middle" font-size="24" font-family="sans-serif" fill="#134e4a">4. 다른 위치 복원으로 보호</text><text x="380" y="500" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#475569">본문의 권장 절차 요약 · 제조사의 측정 결과가 아닙니다</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><title id="chart-title">캠핑용 가스누설경보기 15종, 단계별 경보농도 시험 적합 수</title><desc id="chart-desc">1단계 55ppm: 기준 적합 2종, 기준 부적합 13종 / 2단계 110ppm: 기준 적합 2종, 기준 부적합 13종 / 3단계 330ppm: 기준 적합 11종, 기준 부적합 4종</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1b1f23">캠핑용 가스누설경보기 15종, 단계별 경보농도 시험 적합 수</text><text x="24" y="58" font-size="13" fill="#59636e">소방청 고시 기준 준용 · 1단계 55ppm(60~90분), 2단계 110ppm(10~40분), 3단계 330ppm(0~3분)</text><rect x="24" y="73" width="12" height="12" rx="2" fill="#0f766e"/><text x="42" y="84" font-size="13" fill="#1b1f23">기준 적합</text><rect x="120.16" y="73" width="12" height="12" rx="2" fill="#d97706"/><text x="138.16" y="84" font-size="13" fill="#1b1f23">기준 부적합</text><line x1="70" y1="358" x2="736" y2="358" stroke="#e3e6ea"/><text x="62" y="362" font-size="11" fill="#59636e" text-anchor="end">0종</text><line x1="70" y1="298" x2="736" y2="298" stroke="#e3e6ea"/><text x="62" y="302" font-size="11" fill="#59636e" text-anchor="end">5종</text><line x1="70" y1="238" x2="736" y2="238" stroke="#e3e6ea"/><text x="62" y="242" font-size="11" fill="#59636e" text-anchor="end">10종</text><line x1="70" y1="178" x2="736" y2="178" stroke="#e3e6ea"/><text x="62" y="182" font-size="11" fill="#59636e" text-anchor="end">15종</text><line x1="70" y1="118" x2="736" y2="118" stroke="#e3e6ea"/><text x="62" y="122" font-size="11" fill="#59636e" text-anchor="end">20종</text><text x="181" y="378" font-size="12" fill="#1b1f23" text-anchor="middle">1단계 55ppm</text><text x="403" y="378" font-size="12" fill="#1b1f23" text-anchor="middle">2단계 110ppm</text><text x="625" y="378" font-size="12" fill="#1b1f23" text-anchor="middle">3단계 330ppm</text><rect x="103.3" y="334.0" width="75.7" height="24.0" rx="2" fill
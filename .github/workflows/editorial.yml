name: Twice daily researched publishing
on:
  schedule:
    - cron: '15 0,12 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Research check only, without generation or publication'
        type: boolean
        default: true
      preview:
        description: 'Private draft only; no publication'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  editorial:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDITORIAL_ENABLED: ${{ vars.EDITORIAL_ENABLED }}
      SERVER_EDITORIAL: 'true'
      AI_DISABLED: 'false'
      AI_BILLING_TIER: ${{ vars.AI_BILLING_TIER }}
      FREE_PROVIDER_VERIFIED_AT: ${{ vars.FREE_PROVIDER_VERIFIED_AT }}
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EDITORIAL_PREVIEW_EXCEPTION: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && '2026-10-10' || '' }}
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_CONTACT_URL: ${{ vars.PUBLIC_CONTACT_URL }}
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      HOSTING_PROVIDER: cloudflare
      CLOUDFLARE_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_CONFIRMED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure publication author
        run: |
          git config user.name 'ttajyeobom-editorial'
          git config user.email 'editorial@users.noreply.github.com'
      - name: Research, write and independently review one guide
        id: write
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.preview }}' = 'true' ]; then
            npm run editorial:server -- --preview
          elif [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.probe }}' = 'true' ]; then
            npm run editorial:server -- --probe
          else
            npm run editorial:server
          fi
      - name: Preserve status and selected publication files
        if: always()
        run: node automation/cli/commit-editorial.ts
      - name: Check whether publication needs deployment
        id: publication
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("editorial-ledger/last-run.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT,`publish=${Boolean(r.newPost)}\n`);'
      - name: Verify publication and free hosting
        if: steps.publication.outputs.publish == 'true'
        run: |
          npm run verify
          npm run publication:check
          npm run deployment:check
          npm run gate -- all --online
      # A push by GITHUB_TOKEN does not trigger a second workflow. Deploy here explicitly.
      - name: Deploy verified publication
        if: steps.publication.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
      - name: Verify actual public pages
        if: steps.publication.outputs.publish == 'true'
        run: node automation/cli/verify-live.ts --wait
      - name: Record final deployment outcome
        if: always()
        env:
          FINAL_STATUS: ${{ job.status }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const f="editorial-ledger/last-run.json"; if(fs.existsSync(f)){const r=JSON.parse(fs.readFileSync(f)); r.workflowStatus=process.env.FINAL_STATUS; if(r.newPost)r.deployment=process.env.FINAL_STATUS==="success"?"verified-live":"failed-needs-recovery"; fs.writeFileSync(f,JSON.stringify(r,null,2)+"\n");}'
          node automation/cli/commit-editorial.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-${{ github.run_id }}
          path: |
            editorial-ledger/last-run.json
            automation/drafts/failed/
            automation/drafts/preview/
          retention-days: 7
          if-no-files-found: ignore

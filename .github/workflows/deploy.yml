name: Deploy static site
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require configured free hosting
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare login/token required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account required'; exit 1; }
          test -n "$SITE_URL" || { echo 'Production SITE_URL required'; exit 1; }
      - run: npm ci
      - run: npm run verify
      - run: npm run gate -- all --online
      - run: npx --no-install wrangler deploy
      - name: Verify deployed site
        run: node automation/cli/verify-live.ts

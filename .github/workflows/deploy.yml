name: Deploy static site
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'public/**'
      - 'automation/**'
      - 'tests/**'
      - 'scripts/**'
      - 'astro.config.*'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_READY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      PUBLIC_CONTACT_URL: ${{ vars.PUBLIC_CONTACT_URL }}
      HOSTING_PROVIDER: cloudflare
      CLOUDFLARE_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_CONFIRMED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require configured free hosting
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare login/token required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account required'; exit 1; }
          test -n "$SITE_URL" || { echo 'Production SITE_URL required'; exit 1; }
      - run: npm ci
      - run: npm run deployment:check
      - run: npm run verify
      - run: npm run publication:check
      - run: npm run gate -- all --online
      - run: npx --no-install wrangler deploy
      - name: Verify deployed site
        run: node automation/cli/verify-live.ts
